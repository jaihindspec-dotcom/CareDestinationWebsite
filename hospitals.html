<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Find Hospitals & Treatments | Cardestinations</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root{
            --primary: #0d6efd;
            --muted: #6c757d;
            --bg: #f5f8ff;
            --card-shadow: 0 8px 24px rgba(13,110,253,0.08);
            --glass: rgba(255,255,255,0.75);
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
            color:#222;
            -webkit-font-smoothing:antialiased;
        }

        .container{
            max-width: 1000px;
            margin: 48px auto;
            padding: 24px;
        }

        .card{
            background: var(--glass);
            backdrop-filter: blur(6px);
            border-radius: 14px;
            padding: 22px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(13,110,253,0.06);
        }

        header.top {
            display:flex;
            align-items:center;
            gap:16px;
            margin-bottom:18px;
        }
        .logo {
            background: linear-gradient(135deg,#0d6efd,#6610f2);
            width:56px;height:56px;border-radius:12px;
            display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;
            box-shadow: 0 6px 20px rgba(13,110,253,0.12);
            font-size:18px;
        }
        .title {
            display:flex;flex-direction:column;
        }
        .title h1{
            margin:0;font-size:18px;color:var(--primary);
        }
        .title p{
            margin:0;color:var(--muted);font-size:13px;
        }

        .search-grid{
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:18px;
            margin-top:18px;
        }

        .form-group label{
            display:block;margin-bottom:8px;font-weight:600;color:#333;font-size:13px;
        }

        select, .search-btn{
            width:100%;
            padding:12px 14px;
            border-radius:10px;
            border:1px solid rgba(33,37,41,0.08);
            font-size:14px;
            background:#fff;
        }
        select:focus, .search-btn:focus{
            outline:2px solid rgba(13,110,253,0.15);
        }
        .search-btn{
            background: linear-gradient(90deg,var(--primary), #0056d6);
            color:white;
            border:none;
            font-weight:700;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            transition: transform .12s ease, box-shadow .12s ease;
        }
        .search-btn:hover{ transform: translateY(-2px); box-shadow: 0 10px 30px rgba(13,110,253,0.12); }

        .results{
            margin-top:26px;
        }
        .results h3{
            margin: 0 0 14px 0;color:var(--primary);
        }

        .hospital-list{
            display:grid;
            grid-template-columns: repeat(2, 1fr);
            gap:14px;
        }

        .hospital-card{
            background:#fff;
            border-radius:12px;
            padding:14px;
            border:1px solid rgba(33,37,41,0.04);
            display:flex;
            gap:12px;
            align-items:flex-start;
            box-shadow: 0 6px 18px rgba(16,24,40,0.04);
            transition: transform .12s ease;
        }
        .hospital-card:hover{ transform: translateY(-4px); }

        .hospital-avatar{
            min-width:56px;height:56px;border-radius:10px;
            background:linear-gradient(135deg,#e9f0ff,#fff);
            display:flex;align-items:center;justify-content:center;color:var(--primary);
            font-weight:700;font-size:18px;border:1px solid rgba(13,110,253,0.06);
        }
        .hospital-body{flex:1}
        .hospital-body h4{margin:0 0 6px 0;font-size:16px}
        .hospital-body p{margin:0;color:var(--muted);font-size:13px}
        .hospital-meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
        .pill{background:#f1f5ff;color:var(--primary);padding:6px 8px;border-radius:999px;font-weight:600;font-size:12px;border:1px solid rgba(13,110,253,0.06)}
        .actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
        .view-btn{
            background:#fff;border:1px solid rgba(13,110,253,0.12);color:var(--primary);
            padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px;
        }
        .call-btn{background:linear-gradient(90deg,#28a745,#1e7e34);color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:700;font-size:13px;border:none;}
        .wa-btn{background:#25D366;color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:700;font-size:13px;border:none;display:inline-block}

        .empty{
            text-align:center;color:var(--muted);padding:28px;background:#fff;border-radius:12px;border:1px dashed rgba(33,37,41,0.04);
        }

        /* Modal / profile styles */
        .hd-modal-backdrop{
            position:fixed;inset:0;background:rgba(12,20,40,0.45);display:none;align-items:center;justify-content:center;z-index:1200;
        }
        .hd-modal{
            width: min(920px, 96%);
            max-height: 90vh;
            overflow:auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(13,110,253,0.15);
            border: 1px solid rgba(13,110,253,0.06);
        }
        .hd-modal .modal-header{
            display:flex;gap:12px;align-items:center;padding:18px;border-bottom:1px solid #f1f3f5;
        }
        .hd-modal .modal-header img{
            width:140px;height:96px;object-fit:cover;border-radius:8px;border:1px solid rgba(0,0,0,0.04);
        }
        .hd-modal .modal-header .meta{
            flex:1;
        }
        .hd-modal .modal-header h2{margin:0 0 6px 0;font-size:20px;color:var(--primary)}
        .hd-modal .modal-body{padding:18px;display:grid;grid-template-columns: 1fr 320px;gap:18px}
        .hd-modal .modal-body .left p{margin:0 0 12px 0;color:#333;line-height:1.45}
        .hd-modal .modal-body .right{background:#f8fafc;padding:12px;border-radius:8px;border:1px solid rgba(33,37,41,0.03)}
        .hd-modal .modal-body .right h4{margin:0 0 8px 0}
        .hd-modal .close-btn{
            background:transparent;border:none;font-size:20px;padding:8px;color:var(--muted);cursor:pointer;margin-left:8px
        }
        .hd-modal .stats{display:flex;gap:12px;margin-top:8px}
        .hd-modal .stat{background:#fff;padding:8px;border-radius:8px;border:1px solid rgba(33,37,41,0.03);font-weight:700}
        @media (max-width:900px){
            .hospital-list{grid-template-columns:1fr}
            .search-grid{grid-template-columns:1fr}
            .hd-modal .modal-body{grid-template-columns:1fr}
            .hd-modal .modal-header img{width:120px;height:84px}
            .actions{align-items:flex-start}
        }
    </style>

    <script>
        (function(){
            // Create modal markup and append to document
            document.addEventListener('DOMContentLoaded', () => {
                const backdrop = document.createElement('div');
                backdrop.className = 'hd-modal-backdrop';
                backdrop.innerHTML = `
                    <div class="hd-modal" role="dialog" aria-modal="true">
                        <div class="modal-header">
                            <img src="" alt="Hospital image" id="hd-img">
                            <div class="meta">
                                <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
                                    <div style="flex:1">
                                        <h2 id="hd-title">Hospital Name</h2>
                                        <div style="color:var(--muted);font-size:13px" id="hd-sub">City · Country</div>
                                    </div>
                                    <button class="close-btn" id="hd-close" title="Close">&times;</button>
                                </div>
                                <div class="stats" id="hd-stats" style="margin-top:10px"></div>
                            </div>
                        </div>
                        <div class="modal-body">
                            <div class="left">
                                <p id="hd-desc" style="color:var(--muted)">Loading description…</p>
                                <div id="hd-more"></div>
                            </div>
                            <div class="right">
                                <h4>Contact & Info</h4>
                                <div id="hd-contact" style="color:var(--muted);font-size:14px"></div>
                                <hr style="margin:12px 0;border:none;border-top:1px solid #eef2ff">
                                <h4>Specialities</h4>
                                <div id="hd-specs" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>
                            </div>
                        </div>
                    </div>
                `;
                document.body.appendChild(backdrop);

                const closeBtn = document.getElementById('hd-close');
                backdrop.addEventListener('click', (e) => {
                    if(e.target === backdrop) backdrop.style.display = 'none';
                });
                closeBtn.addEventListener('click', () => { backdrop.style.display = 'none'; });

                // intercept existing inline alert used by template "View details for ..."
                const originalAlert = window.alert.bind(window);
                window.alert = function(msg){
                    if(typeof msg === 'string' && msg.startsWith('View details for ')){
                        const name = msg.replace('View details for ', '').trim();
                        showHospitalProfile(name);
                        return;
                    }
                    originalAlert(msg);
                };
            });

            // Utilities
            function findLocalHospitalDetails(name){
                if(!window.data) return null;
                for(const country of Object.keys(window.data || {})){
                    for(const city of Object.keys(window.data[country] || {})){
                        const hs = (window.data[country][city].hospitals || []);
                        for(const h of hs){
                            if(h.name === name) return Object.assign({country, city}, h);
                        }
                    }
                }
                return null;
            }

            async function fetchWikiSummary(name){
                // try REST summary first (no API key)
                try{
                    const enc = encodeURIComponent(name);
                    const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${enc}`;
                    const res = await fetch(url, {headers:{'Accept':'application/json'}});
                    if(res.ok){
                        const json = await res.json();
                        return {
                            title: json.title || name,
                            extract: json.extract || '',
                            thumbnail: json.thumbnail && json.thumbnail.source ? json.thumbnail.source : null,
                            source: 'wikipedia'
                        };
                    }
                }catch(e){}
                // fallback: search
                try{
                    const sUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(name)}&format=json&origin=*`;
                    const sRes = await fetch(sUrl);
                    if(sRes.ok){
                        const sj = await sRes.json();
                        if(sj.query && sj.query.search && sj.query.search.length){
                            const title = sj.query.search[0].title;
                            const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
                            if(r.ok){
                                const j = await r.json();
                                return {
                                    title: j.title || title,
                                    extract: j.extract || '',
                                    thumbnail: j.thumbnail && j.thumbnail.source ? j.thumbnail.source : null,
                                    source: 'wikipedia'
                                };
                            }
                        }
                    }
                }catch(e){}
                return null;
            }

            // Show profile modal and populate from web + local data
            async function showHospitalProfile(name){
                const backdrop = document.querySelector('.hd-modal-backdrop');
                if(!backdrop) return;
                backdrop.style.display = 'flex';
                const img = document.getElementById('hd-img');
                const title = document.getElementById('hd-title');
                const sub = document.getElementById('hd-sub');
                const desc = document.getElementById('hd-desc');
                const contact = document.getElementById('hd-contact');
                const specs = document.getElementById('hd-specs');
                const stats = document.getElementById('hd-stats');
                const more = document.getElementById('hd-more');

                title.textContent = name;
                sub.textContent = '';
                desc.textContent = 'Loading description…';
                contact.innerHTML = '';
                specs.innerHTML = '';
                stats.innerHTML = '';
                more.innerHTML = '';

                // local data if any
                const local = findLocalHospitalDetails(name);
                if(local){
                    sub.textContent = `${local.city} · ${local.country}`;
                    contact.innerHTML = `
                        <div><strong>Address:</strong> <div style="color:#333;margin-top:6px">${local.address || 'N/A'}</div></div>
                        <div style="margin-top:8px"><strong>Phone:</strong><div style="color:#333;margin-top:6px">${local.phone || 'N/A'}</div></div>
                    `;
                    if(Array.isArray(local.treatments)){
                        local.treatments.forEach(t => {
                            const s = document.createElement('span');
                            s.className = 'pill';
                            s.style.background = '#fff';
                            s.style.color = 'var(--primary)';
                            s.textContent = t;
                            specs.appendChild(s);
                        });
                    }
                    stats.innerHTML = `<div class="stat">City: ${local.city}</div><div class="stat">${local.treatments ? local.treatments.length + ' Specialities' : ''}</div>`;
                }

                // try fetching wiki summary and image
                let wiki = null;
                try{
                    wiki = await fetchWikiSummary(name);
                }catch(e){ wiki = null; }

                if(wiki && wiki.extract){
                    desc.textContent = wiki.extract;
                } else {
                    desc.textContent = local && local.address ? `Profile for ${name}.` : 'No detailed description found.';
                }

                // choose image: wiki thumbnail -> Unsplash fallback -> placeholder
                const fallback = `https://source.unsplash.com/800x500/?hospital,${encodeURIComponent(name)}`;
                img.src = wiki && wiki.thumbnail ? wiki.thumbnail : fallback;
                img.alt = name + ' image';

                // additional link to source if available
                if(wiki && wiki.source === 'wikipedia'){
                    more.innerHTML = `<p style="margin-top:12px;font-size:13px;color:var(--muted)">Source: Wikipedia — <a href="https://en.wikipedia.org/wiki/${encodeURIComponent(wiki.title)}" target="_blank" rel="noopener">Open page</a></p>`;
                }

                // ensure modal scrolled to top of content
                const modal = document.querySelector('.hd-modal');
                if(modal) modal.scrollTop = 0;
            }

            // expose function globally so other scripts can call
            window.showHospitalProfile = showHospitalProfile;
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="card">
            <header class="top">
                <div class="logo">CD</div>
                <div class="title">
                    <h1>Find Hospitals & Treatments</h1>
                    <p>Choose a country, city and treatment to view matching hospitals</p>
                </div>
            </header>

            <div class="search-grid">
                <div class="form-group">
                    <label for="countrySelect">1. Select Country</label>
                    <select id="countrySelect" onchange="updateCities()">
                        <!-- populated by JS -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="citySelect">2. Select City</label>
                    <select id="citySelect" onchange="onCityChange()" disabled>
                        <option value="">Choose Country First</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="treatmentSelect">3. Select Treatment</label>
                    <select id="treatmentSelect" disabled>
                        <option value="">All Treatments</option>
                    </select>
                </div>
            </div>

            <div style="margin-top:18px; display:flex; gap:12px;">
                <button class="search-btn" onclick="searchHospitals()">
                    <i class="fas fa-search"></i> Search Hospitals
                </button>
                <button class="search-btn" style="background:transparent;color:var(--primary);border:1px solid rgba(13,110,253,0.12);" onclick="resetFilters()">
                    <i class="fas fa-rotate-left"></i> Reset
                </button>
            </div>

            <div class="results" id="resultsSection">
                <h3>Matching Hospitals</h3>
                <div id="hospitalResults">
                    <div class="empty">
                        <i class="fas fa-info-circle" style="margin-bottom:8px;display:block;font-size:22px;color:var(--muted)"></i>
                        Select your preferences above to see matching hospitals.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data model: countries -> cities -> treatments + hospitals
        const data = {
            "India": {
                "Delhi": {
                    treatments: ["Orthopaedic", "Gynacology", "Dental"],
                    hospitals: [
                        {
                            name: "MAX Super Speciality Hospital, Delhi",
                            treatments: ["Orthopaedic", "Gynacology", "Dental"],
                            address: "Saket, New Delhi",
                            phone: "+91 11 1234 5678"
                        }
                    ]
                },
                "Noida": {
                    treatments: ["Orthopaedic", "Gynacology", "Dental"],
                    hospitals: [
                       
                        {
                            name: "Yatharth Hospital, Noida",
                            treatments: ["Gynacology", "Orthopaedic", "Dental"],
                            address: "Sector 12, Noida",
                            phone: "+91 120 4444 555"
                        }
                    ]
                },
                "Lucknow": {
                    treatments: ["Orthopaedic", "Gynacology", "Dental"],
                    hospitals: [
                        {
                            name: "Healthcity Vistaar, Lucknow",
                            treatments: ["Gynacology", "Dental","Orthopaedic"],
                            address: "Lucknow",
                            phone: "+91 522 1234 000"
                        }
                    ]
                }
            }
        };

        const countrySelect = document.getElementById('countrySelect');
        const citySelect = document.getElementById('citySelect');
        const treatmentSelect = document.getElementById('treatmentSelect');
        const hospitalResults = document.getElementById('hospitalResults');

        function populateCountries(){
            countrySelect.innerHTML = '';
            const countries = Object.keys(data);
            countries.forEach((c, idx) => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                if(idx === 0) opt.selected = true;
                countrySelect.appendChild(opt);
            });
            updateCities();
        }

        function updateCities(){
            const country = countrySelect.value;
            citySelect.innerHTML = '';
            treatmentSelect.innerHTML = '<option value="">All Treatments</option>';
            if(!country || !data[country]){
                citySelect.disabled = true;
                treatmentSelect.disabled = true;
                citySelect.innerHTML = '<option value="">Choose Country First</option>';
                treatmentSelect.innerHTML = '<option value="">Choose Country First</option>';
                hospitalResults.innerHTML = emptyState();
                return;
            }
            const cities = Object.keys(data[country]);
            citySelect.disabled = false;
            cities.forEach((city, idx) => {
                const opt = document.createElement('option');
                opt.value = city;
                opt.textContent = city;
                if(idx === 0) opt.selected = true;
                citySelect.appendChild(opt);
            });
            // populate treatments for default (first) city
            updateTreatments();
            onCityChange();
        }

        function updateTreatments(){
            const country = countrySelect.value;
            const city = citySelect.value;
            treatmentSelect.innerHTML = '<option value="">All Treatments</option>';
            if(!country || !city) { treatmentSelect.disabled = true; return; }
            const treatments = data[country][city].treatments || [];
            const unique = Array.from(new Set(treatments));
            unique.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                treatmentSelect.appendChild(opt);
            });
            treatmentSelect.disabled = false;
        }

        function emptyState(){
            return `<div class="empty">
                        <i class="fas fa-info-circle" style="margin-bottom:8px;display:block;font-size:22px;color:var(--muted)"></i>
                        Select your preferences above to see matching hospitals.
                    </div>`;
        }

        function onCityChange(){
            updateTreatments();
            renderHospitals(); // show hospitals immediately when city changes
        }

        function searchHospitals(){
            renderHospitals(true);
        }

        function renderHospitals(fromSearch){
            const country = countrySelect.value;
            const city = citySelect.value;
            const treatment = treatmentSelect.value;

            if(!country || !city){
                hospitalResults.innerHTML = emptyState();
                return;
            }

            const cityData = data[country][city];
            if(!cityData || !cityData.hospitals || cityData.hospitals.length === 0){
                hospitalResults.innerHTML = `<div class="empty"><strong>No hospitals found for ${city}.</strong></div>`;
                return;
            }

            const list = cityData.hospitals.filter(h => {
                if(!treatment) return true;
                return h.treatments.map(t => t.toLowerCase()).includes(treatment.toLowerCase());
            });

            if(list.length === 0){
                hospitalResults.innerHTML = `<div class="empty"><strong>No hospitals offering "${treatment}" in ${city}.</strong></div>`;
                return;
            }

            const html = list.map(h => {
                const initials = h.name.split(' ').slice(0,2).map(s=>s[0]).join('').toUpperCase().slice(0,2);
                const pills = h.treatments.map(t => `<span class="pill">${t}</span>`).join(' ');

                // Build URLs for Book Appointment and WhatsApp
                const bookUrl = `contact-us.html?hospital=${encodeURIComponent(h.name)}`;
                // sanitize phone digits for wa.me if available
                let waUrl;
                if(h.phone){
                    const digits = (h.phone || '').replace(/\D/g,'');
                    if(digits) {
                        waUrl = `https://wa.me/${digits}?text=${encodeURIComponent('Hello, I would like to book an appointment at ' + h.name + '.')}`;
                    } else {
                        waUrl = `https://wa.me/?text=${encodeURIComponent('Hello, I would like to book an appointment at ' + h.name + '.')}`;
                    }
                } else {
                    waUrl = `https://wa.me/?text=${encodeURIComponent('Hello, I would like to book an appointment at ' + h.name + '.')}`;
                }

                return `<div class="hospital-card" role="article" aria-label="${h.name}">
                            <div class="hospital-avatar">${initials}</div>
                            <div class="hospital-body">
                                <h4>${h.name}</h4>
                                <p>${h.address} · <span style="color:var(--muted)">${h.phone}</span></p>
                                <div class="hospital-meta">${pills}</div>
                            </div>
                            <div class="actions">
                                <a class="view-btn" href="${bookUrl}" title="Book Appointment">Book Appointment</a>
                                <a class="wa-btn" href="${waUrl}" target="_blank" rel="noopener noreferrer" title="Chat on WhatsApp">
                                    <i class="fab fa-whatsapp" style="margin-right:8px"></i> WhatsApp
                                </a>
                            </div>
                        </div>`;
            }).join('');

            hospitalResults.innerHTML = `<div class="hospital-list">${html}</div>`;
        }

        function resetFilters(){
            populateCountries();
            treatmentSelect.disabled = true;
            citySelect.disabled = false;
            hospitalResults.innerHTML = emptyState();
        }

        // initialize
        populateCountries();
    </script>
</body>
</html>
