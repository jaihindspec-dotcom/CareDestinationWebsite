<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Specialist Doctors | Cardestinations</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #007bff; /* Cardestinations Blue */
            --background-light: #f8f9fa;
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background-light);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }
        
        /* Search Card */
        .search-finder {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
        }
        .search-finder h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
            font-size: 2em;
        }

        /* Dropdown Layout */
        .dropdown-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .dropdown-grid select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: white;
            appearance: none; 
            cursor: pointer;
            font-size: 1em;
        }
        
        .search-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        /* Results & Item Styling */
        #doctorResults { 
            margin-top: 40px;
            padding: 10px 0;
            border-top: 2px solid var(--primary-color);
        }

        .doctor-item { 
            background: #f7f9fc;
            border: 1px solid #e0e0e0;
            margin-bottom: 12px;
            padding: 15px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .doctor-item h4 { margin: 0; font-size: 1.2em; }
        .doctor-item p { color: #6c757d; margin: 5px 0 0 0; font-size: 0.9em; }

        .view-details-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        /* Profile Display Styling */
        #profileDisplay {
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            margin-top: 30px;
        }
        .profile-card {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }
        .profile-photo {
            flex-shrink: 0;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid var(--primary-color);
        }
        .profile-content h2 { margin-top: 0; }
        .profile-content h3 {
            color: var(--primary-color);
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
            margin-top: 20px;
            font-size: 1.1em;
            font-weight: 600;
        }
        .profile-content ul { list-style: none; padding: 0; }
        
        @media (max-width: 768px) {
            .dropdown-grid { grid-template-columns: 1fr; }
            .profile-card { flex-direction: column; align-items: center; text-align: center; }
            .profile-photo { margin-bottom: 20px; }
            .doctor-item { flex-direction: column; align-items: flex-start; }
            .view-details-btn { margin-top: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="search-finder">
            <h2>Find Specialist Doctors by Location and Treatment</h2>

            <div class="dropdown-grid">
                
                <div class="form-group">
                    <label for="countrySelect">1. Select Country</label>
                    <select id="countrySelect" onchange="updateCities()">
                        <option value="">Choose Country</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="citySelect">2. Select City</label>
                    <select id="citySelect" onchange="updateTreatments()" disabled>
                        <option value="">Choose City First</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="treatmentSelect">3. Select Specialty</label>
                    <select id="treatmentSelect" disabled>
                        <option value="">Choose Specialty</option>
                    </select>
                </div>
            </div>

            <button class="search-btn" onclick="searchDoctors()">
                <i class="fas fa-search"></i> Search Doctors
            </button>
            
            <div id="doctorResults">
                <p style="text-align: center; color: #6c757d;">Select your preferences above to see matching doctors.</p>
            </div>
        </div>

        <div id="profileDisplay" style="display: none;">
            </div>
    </div>
</body>
<script>
    // GLOBAL array to hold the currently filtered list of doctors
    let filteredDoctors = [];

    // --- SIMULATED DOCTOR DATA (ENRICHED WITH PROFILE DETAILS) ---
    const doctorData = {
        "India": {
            "Delhi": {
                "Orthopadic": [
                    { 
                        id: 101,
                        name: "Dr. Vijay Sharma", 
                        specialty: "Orthopadic Surgeon", 
                        hospital: "Max Healthcare",
                        photoUrl: "https://via.placeholder.com/200?text=Dr.+Vijay", 
                        experience: "20+ Years",
                        bio: "Leading Delhi-based orthopedic surgeon specializing in knee and hip replacement.",
                        qualifications: ["MBBS, MS (Ortho)"],
                        website: "#"
                    }
                ],
                "Gynaecology": [
                     { 
                        id: 201,
                        name: "Dr. Anjali Verma", 
                        specialty: "Gynaecology & IVF", 
                        hospital: "Apollo Hospital",
                        photoUrl: "https://via.placeholder.com/200?text=Dr.+Anjali", 
                        experience: "15 Years",
                        bio: "Expert in complex fertility treatments and high-risk pregnancies.",
                        qualifications: ["MBBS, MD (Obs/Gyn)"],
                        website: "#"
                    }
                ],
                "Dentist": [
                    { 
                        id: 301,
                        name: "Dr. Rohan Gupta", 
                        specialty: "Cosmetic Dentist", 
                        hospital: "Fortis Escorts",
                        photoUrl: "https://via.placeholder.com/200?text=Dr.+Rohan", 
                        experience: "12 Years",
                        bio: "Specializing in aesthetic dentistry and dental implants.",
                        qualifications: ["BDS, MDS"],
                        website: "#"
                    }
                ]
            },
            "Noida": {
                "Orthopadic": [
                    { 
                        id: 401,
                        name: "Dr. Suresh Kumar", 
                        specialty: "Trauma and Fracture Specialist", 
                        hospital: "Jaypee Hospital",
                        photoUrl: "https://via.placeholder.com/200?text=Dr.+Suresh", 
                        experience: "10 Years",
                        bio: "Dedicated orthopedic specialist focusing on sports injuries and trauma care.",
                        qualifications: ["MBBS, MS (Ortho)"],
                        website: "#"
                    }
                ]
            },
            "Lucknow": {
                // --- USER REQUESTED DOCTORS ---
                "Orthopadic": [
                    { 
                        id: 501,
                        name: "Dr. Sandeep Kapoor", 
                        specialty: "Orthopaedic & Joint Replacement Surgeon", 
                        hospital: "Healthcity Hospital",
                        photoUrl: "images/dr-sandeep-kapoor.jpg", 
                        experience: "25+ Years",
                        bio: "Dr. Sandeep Kapoor is a globally recognized expert in Knee and Hip Replacement surgery, pioneering advanced techniques for minimal recovery time. He has performed over 10,000 successful joint surgeries and is highly recommended for medical tourists.", 
                        qualifications: ["MBBS", "MS (Ortho)", "Fellowship in Joint Reconstruction (Germany)", "MCh Orthopaedics (UK)"],
                        website: "https://drsandeepkapoor.com"
                    }
                ],
                "Gynaecology": [
                    { 
                        id: 502,
                        name: "Dr. Darshna Kapoor", 
                        specialty: "IVF, Infertility & High-Risk Pregnancy", 
                        hospital: "Healthcity Hospital",
                        // NOTE: Use your internal photo URL here.
                        photoUrl: "images/dr-darshna-kapoor.jpg", 
                        experience: "20+ Years",
                        bio: "A leading fertility specialist known for achieving high success rates in complex IVF cases. Dr. Kapoor is highly respected for her compassionate care and expertise in reproductive medicine. ",
                        qualifications: ["MBBS", "MD (Obs/Gyn)", "Diploma in Reproductive Medicine (UK)"],
                        website: "https://drdarshnakapoor.com"
                    }
                ],
                "Dentist": [
                    { 
                        id: 503,
                        name: "Dr. Sudhir Kapoor", 
                        specialty: "Cosmetic & Implant Dentistry", 
                        hospital: "Healthcity Hospital",
                        // NOTE: Use your internal photo URL here.
                        photoUrl: "images/dr-sudhir-kapoor.jpg", 
                        experience: "15 Years",
                        bio: "Dr. Sudhir Kapoor specializes in state-of-the-art **full mouth rehabilitation** and aesthetic dentistry, helping international patients achieve perfect smiles.",
                        qualifications: ["BDS", "MDS (Prosthodontics)", "Fellowship in Aesthetic Dentistry"],
                        website: "#" // Assuming no external website provided
                    }
                ]
            }
        }
    };
    
    // --- CORE LOGIC ---
    const countrySelect = document.getElementById('countrySelect');
    const citySelect = document.getElementById('citySelect');
    const treatmentSelect = document.getElementById('treatmentSelect');
    const doctorResults = document.getElementById('doctorResults');
    const profileDisplay = document.getElementById('profileDisplay');

    // Populate countries on load
    window.onload = function() {
        for (const country in doctorData) {
            const option = document.createElement('option');
            option.value = country;
            option.textContent = country;
            countrySelect.appendChild(option);
        }
    };

    function updateCities() {
        const selectedCountry = countrySelect.value;
        citySelect.innerHTML = '<option value="">Choose City</option>';
        treatmentSelect.innerHTML = '<option value="">Choose Specialty</option>';
        citySelect.disabled = true;
        treatmentSelect.disabled = true;
        doctorResults.innerHTML = '<p style="text-align: center; color: #6c757d;">Select your preferences above to see matching doctors.</p>';
        profileDisplay.style.display = 'none'; 

        if (selectedCountry && doctorData[selectedCountry]) {
            citySelect.disabled = false;
            for (const city in doctorData[selectedCountry]) {
                const option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                citySelect.appendChild(option);
            }
        }
    }

    function updateTreatments() {
        const selectedCountry = countrySelect.value;
        const selectedCity = citySelect.value;
        treatmentSelect.innerHTML = '<option value="">Choose Specialty</option>';
        treatmentSelect.disabled = true;
        doctorResults.innerHTML = '<p style="text-align: center; color: #6c757d;">Select your preferences above to see matching doctors.</p>';
        profileDisplay.style.display = 'none'; 

        if (selectedCountry && selectedCity && doctorData[selectedCountry][selectedCity]) {
            treatmentSelect.disabled = false;
            const treatments = doctorData[selectedCountry][selectedCity];
            for (const treatment in treatments) {
                const option = document.createElement('option');
                option.value = treatment;
                option.textContent = treatment;
                treatmentSelect.appendChild(option);
            }
        }
    }

    function searchDoctors() {
        const country = countrySelect.value;
        const city = citySelect.value;
        const treatment = treatmentSelect.value;
        
        profileDisplay.style.display = 'none'; 
        doctorResults.innerHTML = '';

        if (!country || !city || !treatment) {
            doctorResults.innerHTML = '<p style="color: red; text-align: center;">Please select Country, City, and Specialty.</p>';
            return;
        }

        // Retrieve doctors array (contains full profile data)
        filteredDoctors = (doctorData[country] && doctorData[country][city] && doctorData[country][city][treatment]) ? doctorData[country][city][treatment] : [];

        if (filteredDoctors.length > 0) {
            let htmlContent = `<h3>Top ${treatment} Specialists in ${city}</h3>`;
            
            filteredDoctors.forEach((doctor, index) => {
                // Pass the index to the showDoctorProfile function
                htmlContent += `
                    <div class="doctor-item">
                        <div>
                            <h4>${doctor.name}</h4>
                            <p>${doctor.specialty} | Affiliated with: ${doctor.hospital}</p>
                        </div>
                        <button class="view-details-btn" onclick="showDoctorProfile(${index})" style="margin-right:16px;">
                            View Full Profile
                        </button>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <a class="view-details-btn" href="contact-us.html" title="Book Appointment">
                                <i class="fas fa-calendar-check" style="margin-right:6px;"></i> Book Appointment
                            </a>
                            <a class="view-details-btn" style="background-color: #25D366; color: #ffffff; border-color: #25D366;" href="https://wa.me/?text=${encodeURIComponent(`Hello, I would like to book an appointment with ${doctor.name} - ${doctor.specialty}`)}" target="_blank" rel="noopener noreferrer" title="Message on WhatsApp">
                                <i class="fab fa-whatsapp" style="margin-right:6px;"></i> WhatsApp
                            </a>
                        </div>
                    </div>
                `;
            });
            doctorResults.innerHTML = htmlContent;
        } else {
            doctorResults.innerHTML = `<p style="text-align: center; color: #ff9900;">No specialists found for ${treatment} in ${city}.</p>`;
        }
    }
    
    // --- PROFILE RENDERING FUNCTION ---
    function showDoctorProfile(index) {
        const doctor = filteredDoctors[index];
        
        if (!doctor) {
            profileDisplay.innerHTML = '<p style="color: red;">Error: Doctor profile data missing.</p>';
            profileDisplay.style.display = 'block';
            return;
        }

        // Create the Qualifications list HTML
        let qualificationsHtml = '';
        if (doctor.qualifications && doctor.qualifications.length) {
            doctor.qualifications.forEach(q => {
                qualificationsHtml += `<li>${q}</li>`;
            });
        } else {
             qualificationsHtml = `<li>Qualifications coming soon.</li>`;
        }


        // Build the full profile card HTML
        const profileHtml = `
            <div class="profile-card">
                <img src="${doctor.photoUrl || 'https://via.placeholder.com/200?text=Photo+Missing'}" alt="Photo of ${doctor.name}" class="profile-photo">
                
                <div class="profile-content">
                    <h2>${doctor.name}</h2>
                    <p style="color: var(--primary-color); font-weight: bold; font-size: 1.2em;">${doctor.specialty}</p>
                    
                    <h3>About the Doctor</h3>
                    <p>${doctor.bio || 'Detailed biography coming soon.'}</p>
                    
                    <h3>Key Details</h3>
                    <ul>
                        <li><i class="fas fa-hospital" style="margin-right: 8px;"></i> **Primary Hospital:** ${doctor.hospital}</li>
                        <li><i class="fas fa-briefcase" style="margin-right: 8px;"></i> **Experience:** ${doctor.experience || 'N/A'}</li>
                        <li><i class="fas fa-graduation-cap" style="margin-right: 8px;"></i> **Qualifications:**
                            <ul style="margin-top: 5px; margin-left: 20px;">
                                ${qualificationsHtml}
                            </ul>
                        </li>
                    </ul>
                    
                </div>
            </div>
        `;
        
        profileDisplay.innerHTML = profileHtml;
        profileDisplay.style.display = 'block';
        
        profileDisplay.scrollIntoView({ behavior: 'smooth' });
    }
</script>
</html>
